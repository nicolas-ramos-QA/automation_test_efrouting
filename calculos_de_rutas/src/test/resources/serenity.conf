screenplay.pronouns="el,ella,ellos"

webdriver {
    driver = "chrome"
    autodownload = true
    capabilities {
        browserName = "chrome"
        "goog:chromeOptions" {
            args = [
                "disable-infobars",
                "disable-popup-blocking",
                "disable-default-apps",
                "remote-allow-origins=*"
            ]
        }
    }
}

environments {
    remote{
        webdriver{
            driver = "remote"
            remote{
                url = "http://${BROWSERSTACK_USER}:${BROWSERSTACK_KEY}@hub.browserstack.com/wd/hub"
            }
            capabilities {
                browserName = "Chrome"
                browserVersion = "latest"

                "goog:chromeOptions" {
                    args = [
                        "start-maximized",
                        "window-size=1920,1080",
                        "test-type",
                        "no-sandbox",
                        "ignore-certificate-errors",
                        "incognito",
                        "disable-infobars",
                        "disable-gpu",
                        "disable-default-apps",
                        "disable-popup-blocking"
                    ]
                }

                "bstack:options" {
                    os = "Windows"
                    osVersion = "11"
                    resolution = "1920x1200"
                    seleniumVersion = "4.6.0"
                    video = true
                    idleTimeout = 300
                }
            }
        }
    }
}

pages {
    # QA es el ambiente que expone las columnas financieras (Fuel, Toll, Custom, Op cost, Profit).
    exercise = "https://efdata-qa.efrouting.com/login"
}

serenity {
    encoding = "UTF-8"
    compress.filenames = true
    full.page.screenshots.strategy = true
    take.screenshots = FOR_EACH_ACTION

    report {
        enable = true
        accesibility = true
        exclude.tags = "resetappstate,singlebrowser,manual"
        outputDirectory = target/site/serenity
    }

    requirement {
        types = "theme, epic, feature"
    }

    reports.show.step.details = true
    verbosity = high
}
